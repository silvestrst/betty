# cargo-deny policy, checked in CI by `cargo deny check`.
# See the design's "PolyForm Perimeter licence" decision in docs/design/architecture.md.

[graph]
# Check optional dependencies too, so enabling a feature can't bring in an unchecked licence.
all-features = true

[advisories]
# Fail on any RustSec advisory that affects the dependency graph.
ignore = []

[licenses]
# Betty is under PolyForm Perimeter, so every dependency must allow use in a product that isn't
# open source. GPL, LGPL and AGPL crates are not allowed. MPL-2.0 is copyleft per file only, so it
# is. Add a licence here only after checking its compatibility.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list is the policy, not an inventory of what is in use today.
unused-allowed-license = "allow"

[licenses.private]
# Betty's own crates are unpublished and carry Perimeter, which has no SPDX id, so skip them.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between Betty's own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
